<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="易 — 在人生卡住時，陪你判斷該停一下、勇敢一次，或看見現在也很好。">
  <meta id="theme-color" name="theme-color" content="#06000f">
  <title>易 — 人生決策輔助器</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem('yi_theme');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20260714-3">
  <link rel="stylesheet" href="css/style2.css?v=20260714-3">
  <link rel="stylesheet" href="css/style3.css?v=20260714-3">
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" focusable="false">
    <symbol id="icon-arrow-left" viewBox="0 0 24 24">
      <path d="M15 18L9 12l6-6"></path>
      <path d="M9 12h10"></path>
    </symbol>
    <symbol id="icon-scales" viewBox="0 0 24 24">
      <path d="M12 4v14"></path>
      <path d="M7 7h10"></path>
      <path d="M8 7l-3 5h6l-3-5Z"></path>
      <path d="M16 7l-3 5h6l-3-5Z"></path>
      <path d="M9 18h6"></path>
    </symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path d="M12 20s-6.5-4.35-8.5-8.05C1.8 8.7 3.45 5 7.3 5c1.95 0 3.2 1.02 4.7 2.88C13.5 6.02 14.75 5 16.7 5c3.85 0 5.5 3.7 3.8 6.95C18.5 15.65 12 20 12 20Z"></path>
    </symbol>
    <symbol id="icon-book" viewBox="0 0 24 24">
      <path d="M4.5 6.5c0-1.1.9-2 2-2H12v14H6.5a2 2 0 0 1-2-2v-10Z"></path>
      <path d="M19.5 6.5c0-1.1-.9-2-2-2H12v14h5.5a2 2 0 0 0 2-2v-10Z"></path>
      <path d="M8 8.5h2.2"></path>
      <path d="M13.8 8.5H16"></path>
    </symbol>
    <symbol id="icon-briefcase" viewBox="0 0 24 24">
      <path d="M8 7V5.8C8 4.8 8.8 4 9.8 4h4.4c1 0 1.8.8 1.8 1.8V7"></path>
      <path d="M4.5 8.5h15a1.5 1.5 0 0 1 1.5 1.5v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10a1.5 1.5 0 0 1 1.5-1.5Z"></path>
      <path d="M3 12h18"></path>
      <path d="M10.2 12v2h3.6v-2"></path>
    </symbol>
    <symbol id="icon-coins" viewBox="0 0 24 24">
      <ellipse cx="12" cy="7" rx="6.5" ry="2.5"></ellipse>
      <path d="M5.5 7v4c0 1.38 2.9 2.5 6.5 2.5s6.5-1.12 6.5-2.5V7"></path>
      <path d="M5.5 11v4c0 1.38 2.9 2.5 6.5 2.5s6.5-1.12 6.5-2.5v-4"></path>
    </symbol>
    <symbol id="icon-burst" viewBox="0 0 24 24">
      <path d="M12 3.5 13.9 8.1 18.5 10 13.9 11.9 12 16.5 10.1 11.9 5.5 10 10.1 8.1 12 3.5Z"></path>
      <path d="M18 4.5v2"></path>
      <path d="M19 5.5h-2"></path>
      <path d="M6 17.5v3"></path>
      <path d="M7.5 19H4.5"></path>
    </symbol>
    <symbol id="icon-hash" viewBox="0 0 24 24">
      <path d="M9 4 7 20"></path>
      <path d="M17 4 15 20"></path>
      <path d="M4 9h16"></path>
      <path d="M3 15h16"></path>
    </symbol>
    <symbol id="icon-coin" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7.5"></circle>
      <rect x="9" y="9" width="6" height="6" rx="1"></rect>
      <path d="M12 4.5v2"></path>
      <path d="M12 17.5v2"></path>
      <path d="M4.5 12h2"></path>
      <path d="M17.5 12h2"></path>
    </symbol>
    <symbol id="icon-dice" viewBox="0 0 24 24">
      <rect x="5" y="5" width="14" height="14" rx="3"></rect>
      <circle cx="9" cy="9" r="1"></circle>
      <circle cx="15" cy="9" r="1"></circle>
      <circle cx="12" cy="12" r="1"></circle>
      <circle cx="9" cy="15" r="1"></circle>
      <circle cx="15" cy="15" r="1"></circle>
    </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
      <path d="M6 6.5h12A2.5 2.5 0 0 1 20.5 9v6A2.5 2.5 0 0 1 18 17.5H11l-4.5 3v-3H6A2.5 2.5 0 0 1 3.5 15V9A2.5 2.5 0 0 1 6 6.5Z"></path>
      <path d="M8 11h8"></path>
      <path d="M8 14h5"></path>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="m12 4.4 2.28 4.62 5.1.74-3.69 3.6.87 5.08L12 16.03 7.44 18.44l.87-5.08-3.69-3.6 5.1-.74L12 4.4Z"></path>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.5"></circle>
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"></path>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M19.1 15.5A8 8 0 0 1 8.5 4.9 8 8 0 1 0 19.1 15.5Z"></path>
    </symbol>
  </svg>
  <div class="app-background"></div>
  <canvas id="particle-canvas"></canvas>
  <div id="reveal-flash" class="reveal-flash"></div>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換為明亮主題" aria-pressed="false">
    <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
      <svg class="ui-icon" focusable="false"><use href="#icon-sun"></use></svg>
    </span>
    <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
      <svg class="ui-icon" focusable="false"><use href="#icon-moon"></use></svg>
    </span>
    <span class="theme-toggle__label">明亮</span>
  </button>

  <!-- ═══ 場景 1：首頁 ═══ -->
  <div id="scene-home" class="scene active">
    <button type="button" id="home-enter" class="home-enter-btn" aria-label="開始問卦">
      <span class="home-title">易</span>
      <span class="home-subtitle">人 生 決 策 輔 助 器</span>
      <span class="home-hint">靜心凝神，點擊開始</span>
    </button>
    <div id="home-daily-status" class="home-daily-status" aria-live="polite"></div>
    <button type="button" id="btn-open-journal" class="home-journal-btn">
      <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-book"></use></svg>
      <span>我的卦跡</span>
    </button>
  </div>

  <!-- ═══ 場景 2：選擇方向 ═══ -->
  <div id="scene-direction" class="scene">
    <button type="button" class="back-btn" data-back="home" aria-label="返回首頁">
      <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-arrow-left"></use></svg>
    </button>
    <div class="direction-title">你現在卡在哪個方向？</div>
    <div class="direction-grid">
      <button type="button" class="direction-card direction-card--wide" data-direction="yesno" id="dir-yesno">
        <span class="direction-icon" aria-hidden="true">
          <svg class="ui-icon" focusable="false"><use href="#icon-scales"></use></svg>
        </span>
        <span class="direction-label">是／否</span>
        <span class="direction-desc">生活小事、要不要、行不行</span>
      </button>
      <button type="button" class="direction-card" data-direction="love" id="dir-love">
        <span class="direction-icon" aria-hidden="true">
          <svg class="ui-icon" focusable="false"><use href="#icon-heart"></use></svg>
        </span>
        <span class="direction-label">感情</span>
        <span class="direction-desc">愛情、關係、人際</span>
      </button>
      <button type="button" class="direction-card" data-direction="study" id="dir-study">
        <span class="direction-icon" aria-hidden="true">
          <svg class="ui-icon" focusable="false"><use href="#icon-book"></use></svg>
        </span>
        <span class="direction-label">學業</span>
        <span class="direction-desc">考試、學習、進修</span>
      </button>
      <button type="button" class="direction-card" data-direction="career" id="dir-career">
        <span class="direction-icon" aria-hidden="true">
          <svg class="ui-icon" focusable="false"><use href="#icon-briefcase"></use></svg>
        </span>
        <span class="direction-label">工作</span>
        <span class="direction-desc">事業、職涯、決策</span>
      </button>
      <button type="button" class="direction-card" data-direction="wealth" id="dir-wealth">
        <span class="direction-icon" aria-hidden="true">
          <svg class="ui-icon" focusable="false"><use href="#icon-coins"></use></svg>
        </span>
        <span class="direction-label">財運</span>
        <span class="direction-desc">投資、理財、收入</span>
      </button>
    </div>
  </div>

  <!-- ═══ 場景 3：起卦方式 ═══ -->
  <div id="scene-method" class="scene">
    <button type="button" class="back-btn" data-back="direction" aria-label="返回方向選擇">
      <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-arrow-left"></use></svg>
    </button>
    <div class="method-title">選擇起卦方式</div>
    <div class="method-subtitle" id="method-subtitle">心中默念你的問題，然後選擇一種方式</div>
    <div class="decision-question-box">
      <label for="decision-question">記下你正在猶豫的事</label>
      <textarea id="decision-question" rows="2" maxlength="160" placeholder="例如：我要不要主動聯絡？（可以留空）"></textarea>
      <span>只保存在你的裝置，不會送到分析工具。</span>
    </div>
    <div id="daily-wisdom-method"></div>

    <div class="method-tabs">
      <button type="button" class="method-tab active" data-method="instant">
        <span class="method-tab-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="#icon-burst"></use></svg></span>
        <span>一念成卦</span>
      </button>
      <button type="button" class="method-tab" data-method="number">
        <span class="method-tab-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="#icon-hash"></use></svg></span>
        <span>數字起卦</span>
      </button>
      <button type="button" class="method-tab" data-method="coin">
        <span class="method-tab-icon" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="#icon-coin"></use></svg></span>
        <span>擲幣問天</span>
      </button>
    </div>

    <!-- 一念成卦 -->
    <div id="panel-instant" class="method-panel active" style="text-align:center">
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:2rem">閉上眼睛，在心中專注想著你的問題，然後點擊</p>
      <button type="button" class="instant-btn" id="btn-instant">問 卦</button>
    </div>

    <!-- 數字起卦 -->
    <div id="panel-number" class="method-panel" style="max-width:420px;width:100%">
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:1.5rem;text-align:center">輸入 6 組數字（1–999），或點擊隨機填入</p>
      <div class="number-grid">
        <div class="number-input-group">
          <label>初爻</label><input type="text" inputmode="numeric" maxlength="3" class="number-input" placeholder="---">
        </div>
        <div class="number-input-group">
          <label>二爻</label><input type="text" inputmode="numeric" maxlength="3" class="number-input" placeholder="---">
        </div>
        <div class="number-input-group">
          <label>三爻</label><input type="text" inputmode="numeric" maxlength="3" class="number-input" placeholder="---">
        </div>
        <div class="number-input-group">
          <label>四爻</label><input type="text" inputmode="numeric" maxlength="3" class="number-input" placeholder="---">
        </div>
        <div class="number-input-group">
          <label>五爻</label><input type="text" inputmode="numeric" maxlength="3" class="number-input" placeholder="---">
        </div>
        <div class="number-input-group">
          <label>上爻</label><input type="text" inputmode="numeric" maxlength="3" class="number-input" placeholder="---">
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-with-icon" id="btn-random-fill">
          <span class="btn-glyph" aria-hidden="true"><svg class="ui-icon" focusable="false"><use href="#icon-dice"></use></svg></span>
          <span>隨機填入</span>
        </button>
        <button type="button" class="btn btn--primary" id="btn-number-go">起 卦</button>
      </div>
    </div>

    <!-- 擲幣問天 -->
    <div id="panel-coin" class="method-panel" style="text-align:center">
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:1.5rem">點擊「擲幣」投擲三枚銅錢，共投六次</p>
      <div class="coin-area">
        <div class="coin">？</div>
        <div class="coin">？</div>
        <div class="coin">？</div>
      </div>
      <div id="coin-progress" class="coin-progress" aria-live="polite">第 0 / 6 爻</div>
      <button type="button" class="btn btn--primary" id="btn-toss" style="margin-top:1rem">擲 幣</button>
      <div id="coin-yao-display" class="yao-display"></div>
    </div>
  </div>

  <!-- ═══ 場景 4：演算動畫 ═══ -->
  <div id="scene-animation" class="scene">
    <div style="text-align:center">
      <div class="divination-text">天地造化中⋯⋯</div>
      <div id="hex-build" class="hexagram-build"></div>
    </div>
  </div>

  <!-- ═══ 場景 5：解卦結果 ═══ -->
  <div id="scene-result" class="scene scene--result">
    <div class="result-container" id="result-content">
      <!-- 動態渲染 -->
    </div>
  </div>

  <!-- ═══ 場景 6：決策卦跡與圖鑑 ═══ -->
  <div id="scene-journal" class="scene scene--journal">
    <button type="button" class="back-btn" data-back="home" aria-label="返回首頁">
      <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-arrow-left"></use></svg>
    </button>
    <div class="journal-shell">
      <div class="journal-eyebrow">決策陪伴紀錄</div>
      <h1 class="journal-title">我的卦跡</h1>
      <p class="journal-subtitle">不是為了證明答案準不準，而是看見自己如何走過每一次猶豫。</p>
      <div id="journal-summary" class="journal-summary"></div>
      <div class="journal-tabs" role="tablist" aria-label="卦跡內容">
        <button type="button" class="journal-tab active" data-journal-tab="history" role="tab" aria-selected="true">卦跡與回聲</button>
        <button type="button" class="journal-tab" data-journal-tab="atlas" role="tab" aria-selected="false">六十四卦圖鑑</button>
        <button type="button" class="journal-tab" data-journal-tab="wisdom" role="tab" aria-selected="false">解答藏書</button>
      </div>
      <div id="journal-content" class="journal-content"></div>
    </div>
  </div>

  <!-- 意見回饋 Modal -->
  <div id="feedback-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">你的想法很重要</div>
      <div class="star-rating" id="star-rating">
        <button type="button" class="star" data-v="1" aria-label="1 顆星" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-star"></use></svg></button>
        <button type="button" class="star" data-v="2" aria-label="2 顆星" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-star"></use></svg></button>
        <button type="button" class="star" data-v="3" aria-label="3 顆星" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-star"></use></svg></button>
        <button type="button" class="star" data-v="4" aria-label="4 顆星" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-star"></use></svg></button>
        <button type="button" class="star" data-v="5" aria-label="5 顆星" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-star"></use></svg></button>
      </div>
      <textarea id="feedback-text" class="feedback-textarea" placeholder="說說你的想法、建議，或這一卦對你的意義…" aria-label="意見內容" rows="4"></textarea>
      <p class="feedback-delivery-note" id="feedback-delivery-note">送出後會開啟郵件，請在郵件程式中確認寄出。</p>
      <div class="btn-row">
        <button type="button" class="btn btn--ghost" id="btn-feedback-cancel">取消</button>
        <button type="button" class="btn btn--primary" id="btn-feedback-submit">寄出回饋</button>
      </div>
    </div>
  </div>

  <!-- 全域 Toast -->
  <div id="share-toast" class="share-toast" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/config.js?v=20260714-3"></script>
  <script src="js/hexagram-data.js?v=20260714-3"></script>
  <script src="js/hexagram-data-2.js?v=20260714-3"></script>
  <script src="js/hexagram-data-3.js?v=20260714-3"></script>
  <script src="js/hexagram-data-4.js?v=20260714-3"></script>
  <script src="js/divination.js?v=20260714-3"></script>
  <script src="js/daily-wisdom.js?v=20260714-3"></script>
  <script src="js/journal.js?v=20260714-3"></script>
  <script src="js/analytics.js?v=20260714-3"></script>
  <script src="js/app.js?v=20260714-3"></script>
</body>
</html>
